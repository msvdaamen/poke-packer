[package]
name = "ptcg-collector"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
async-trait = "0.1.89"
uuid = { version = "1.23.1", features = ["v4", "v7", "serde"] }
argon2 = "0.5.3"
jsonwebtoken = "10.4.0"
dotenv = "0.15.0"
