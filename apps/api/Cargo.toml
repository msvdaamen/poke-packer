[package]
name = "ptcg-collector"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
async-trait = "0.1.89"
uuid = { version = "1.23.1", features = ["v4", "v7", "serde"] }
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
dotenv = "0.15.0"
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "tls-native-tls",
  "uuid",
  "chrono",
] }
chrono = { version = "0.4.44", features = ["serde"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["timeout", "cors"] }
tracing = "0.1.44"

opentelemetry = { version = "0.32.0", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32.0", features = ["trace", "metrics", "logs"] }
opentelemetry-stdout = { version = "0.32.0", features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32.0"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
